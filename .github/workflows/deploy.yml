# GitHub Actions workflow for deploying the Angular application
# to GitHub Pages.
#
# Source branch:
# develop
#
# Website:
# https://harshsinghthakur.github.io/hospitalPrescription-app/

name: Deploy Angular App to GitHub Pages

# Run this workflow whenever code is pushed to develop.
on:
  push:
    branches:
      - develop

# Permissions required by GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# If a new deployment starts, cancel an older deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  # ==========================================================
  # BUILD JOB
  # ==========================================================
  build:
    runs-on: ubuntu-latest

    steps:

      # Download the repository source code.
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install Node.js 24.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install exactly the dependencies from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Build the Angular application for production.
      #
      # GitHub Pages hosts this project under:
      # /hospitalPrescription-app/
      #
      # Therefore Angular needs this base URL.
      - name: Build Angular application
        run: npx ng build --configuration production --base-href /hospitalPrescription-app/

      # Configure GitHub Pages.
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Upload the Angular production build.
      #
      # Our local Angular build creates:
      # dist/hospitalPrescription
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/hospitalPrescription

  # ==========================================================
  # DEPLOY JOB
  # ==========================================================
  deploy:
    runs-on: ubuntu-latest

    # Deploy only after the build job succeeds.
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # Publish the uploaded artifact to GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

