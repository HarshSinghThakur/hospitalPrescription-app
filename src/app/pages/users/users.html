<div class="container-fluid py-3">
    <div class="card shadow-sm border-0">
        <!-- Card Body -->
        <div class="card-body">
            <div class="row">
                <!-- User List -->
                <div class="" [class]="isFormOpen ? 'col-lg-8' : 'col-lg-12'">
                    <div class="row">
                        <div class="col-3 offset-md-7">
                            <select #searchTemplate class="form-select" name="" id="">
                                <option value="Admin">Admin</option>
                                <option value="Doctor">Doctor</option>
                                <option value="Receptionist">Receptionist</option>
                            </select>
                        </div>
                        <div class="col-2 text-end">
                            <button class="btn btn-sm btn-primary" (click)="onSearch()">Search</button>
                            <button class="btn btn-sm btn-secondary" (click)="onReset()"> Reset</button>
                        </div>
                    </div>
                    <div class="card-header bg-primary d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold">
                            User Management
                        </h5>

                        <div>
                            <button class="btn btn-dark btn-sm me-2" (click)="toggleFormVisibility()">
                                <i class="bi bi-plus-circle"></i> Add User
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle">
                            <thead class="table-primary">
                                <tr>
                                    <th>Sr No</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Mobile No</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th width="150">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                @for(item of userList(); track $index){
                                <tr>
                                    <td>{{$index+1}}</td>
                                    <td>{{item.fullName}}</td>
                                    <td>{{item.email}}</td>
                                    <td>{{item.mobileNo}}</td>
                                    <td>{{item.roleName}}</td>
                                    <td>{{item.isActive ? 'Active' : 'Deactive'}}</td>
                                    <td width="150">
                                        <button class="btn btn-sm btn-success">Edit</button>
                                        <button class="btn btn-sm btn-danger">Delete</button>
                                    </td>
                                </tr>
                                }
                                @empty{
                                <tr>
                                    <td colspan="7" class="text-center text-muted py-4">
                                        No Records Found
                                    </td>
                                </tr>
                                }
                            </tbody>
                        </table>
                    </div>
                </div>

                @if(isFormOpen){
                <!-- User Form -->
                <div class="col-lg-4">
                    <div class="card border-primary">
                        <div class="card-header bg-primary text-dark">
                            <div class="row">
                                <h6 class="col-md-6 mb-3 fw-semibold">
                                    User Details
                                </h6>
                                <div class="col-md-6 mb-3">
                                    <button class="btn btn-dark btn-sm" (click)="toggleFormVisibility()">
                                        <i class="bi bi-x-lg"></i> Close
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="card-body">
                            <form [formGroup]="userForm">
                                <div class="row">
                                    <!-- Full Name -->
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Full Name</label>
                                        <input type="text" class="form-control" formControlName="fullName"
                                            placeholder="Enter Full Name">
                                    </div>

                                    <!-- Email -->
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" formControlName="email"
                                            placeholder="Enter Email">
                                    </div>

                                    <!-- Mobile -->
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Mobile No</label>
                                        <input type="text" class="form-control" formControlName="mobileNo"
                                            placeholder="Enter Mobile No">
                                    </div>

                                    <!-- Role -->
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Role</label>
                                        <select class="form-select" formControlName="roleName">
                                            <option value="">Select Role</option>
                                            <option value="Admin">Admin</option>
                                            <option value="Doctor">Doctor</option>
                                            <option value="Receptionist">Receptionist</option>
                                        </select>
                                    </div>

                                    <!-- Password -->
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control" formControlName="password"
                                            placeholder="Enter Password">
                                    </div>

                                    <!-- Status -->
                                    <div class="col-md-6 mb-3 d-flex align-items-end">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" formControlName="isActive">
                                            <label class="form-check-label">
                                                Active
                                            </label>
                                        </div>
                                    </div>

                                    <!-- Buttons -->
                                    <div class="col-12">
                                        <hr>
                                        <div class="d-flex justify-content-end gap-2">

                                            <button type="submit" class="btn btn-primary" (click)="onSaveUser()">
                                                <i class="bi bi-save"></i> Save User
                                            </button>
                                            <button type="reset" class="btn btn-secondary">
                                                <i class="bi bi-arrow-clockwise"></i> Reset
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                }
            </div>
        </div>
    </div>
</div>
